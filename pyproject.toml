[project]
name = "daish"
version = "0.1.0"
description = "Local AI command center: start/stop local models, GPU/CPU/RAM dashboard, inference monitoring."
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "textual==8.2.8",
    "psutil==7.2.2",
    "nvidia-ml-py==13.610.43",
    "httpx>=0.27",
    "rich>=13.7",
    "prometheus-client>=0.20",
]

[project.scripts]
daish = "daish.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daish"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
